# Kubernetes Secret for TLS Certificates
# Store SSL/TLS certificates as Kubernetes secrets

apiVersion: v1
kind: Secret
metadata:
  name: krishiai-tls-secret
  namespace: krishiai
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # Generate with: cat fullchain.pem | base64 -w 0
  tls.crt: LS0tLS1CRUdJTi... # Replace with actual base64 encoded certificate
  # Generate with: cat privkey.pem | base64 -w 0
  tls.key: LS0tLS1CRUdJTi... # Replace with actual base64 encoded private key

---
# ConfigMap for additional certificate chain
apiVersion: v1
kind: ConfigMap
metadata:
  name: krishiai-tls-chain
  namespace: krishiai
data:
  chain.pem: |
    -----BEGIN CERTIFICATE-----
    # Replace with actual certificate chain
    -----END CERTIFICATE-----

---
# ConfigMap for Diffie-Hellman parameters
apiVersion: v1
kind: ConfigMap
metadata:
  name: krishiai-dhparam
  namespace: krishiai
data:
  dhparam.pem: |
    -----BEGIN DH PARAMETERS-----
    # Replace with actual DH parameters
    # Generate with: openssl dhparam 2048
    -----END DH PARAMETERS-----
