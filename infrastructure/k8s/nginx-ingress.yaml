# NGINX Ingress Controller with TLS Configuration
# Handles TLS termination and routing to backend services

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configuration
  namespace: krishiai
data:
  # Force HTTPS redirect
  force-ssl-redirect: "true"
  # HSTS configuration
  hsts: "true"
  hsts-max-age: "31536000"
  hsts-include-subdomains: "true"
  hsts-preload: "true"
  # SSL protocols - TLS 1.3 only
  ssl-protocols: "TLSv1.3"
  # SSL ciphers (TLS 1.3 uses built-in cipher suites)
  ssl-prefer-server-ciphers: "off"
  # Enable OCSP stapling
  enable-ocsp: "true"
  # SSL session configuration
  ssl-session-cache: "true"
  ssl-session-cache-size: "10m"
  ssl-session-timeout: "1d"
  ssl-session-tickets: "false"
  # Buffer sizes
  ssl-buffer-size: "8k"
  # Disable early data (0-RTT) for security
  ssl-early-data: "false"
  # Additional security headers
  add-headers: "krishiai/custom-headers"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-headers
  namespace: krishiai
data:
  X-Frame-Options: "SAMEORIGIN"
  X-Content-Type-Options: "nosniff"
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "geolocation=(self), microphone=(self), camera=(self)"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krishiai-ingress
  namespace: krishiai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
  - hosts:
    - api.krishiai.com
    - auth.krishiai.com
    - crop.krishiai.com
    - market.krishiai.com
    - climate.krishiai.com
    - govt.krishiai.com
    secretName: krishiai-tls-secret
  rules:
  # Main API Gateway
  - host: api.krishiai.com
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3000
      - path: /api/v1/crop
        pathType: Prefix
        backend:
          service:
            name: crop-service
            port:
              number: 8000
      - path: /api/v1/market
        pathType: Prefix
        backend:
          service:
            name: market-service
            port:
              number: 3001
      - path: /api/v1/climate
        pathType: Prefix
        backend:
          service:
            name: climate-service
            port:
              number: 3002
      - path: /api/v1/schemes
        pathType: Prefix
        backend:
          service:
            name: govt-service
            port:
              number: 3003
      - path: /api/v1/chatbot
        pathType: Prefix
        backend:
          service:
            name: govt-service
            port:
              number: 3003
      - path: /health
        pathType: Exact
        backend:
          service:
            name: health-service
            port:
              number: 8080
  
  # Auth Service
  - host: auth.krishiai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3000
  
  # Crop Service
  - host: crop.krishiai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: crop-service
            port:
              number: 8000
  
  # Market Service
  - host: market.krishiai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: market-service
            port:
              number: 3001
  
  # Climate Service
  - host: climate.krishiai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: climate-service
            port:
              number: 3002
  
  # Government Service
  - host: govt.krishiai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: govt-service
            port:
              number: 3003

---
# Cert-Manager ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@krishiai.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Cert-Manager ClusterIssuer for Let's Encrypt Staging (testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@krishiai.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: nginx
