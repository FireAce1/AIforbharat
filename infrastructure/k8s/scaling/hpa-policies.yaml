---
# Redis HPA (for cache layer)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redis-hpa
  namespace: default
  labels:
    app: redis
    tier: cache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  # Custom metric: cache hit rate (scale up if hit rate drops)
  - type: Pods
    pods:
      metric:
        name: redis_cache_hit_rate
      target:
        type: AverageValue
        averageValue: "80"  # Scale up if hit rate < 80%
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30

---
# Notes on HPA Configuration:
#
# 1. minReplicas: Minimum pods to maintain (ensures availability)
# 2. maxReplicas: Maximum pods to scale to (cost control)
# 3. CPU/Memory targets: Percentage utilization that triggers scaling
# 4. stabilizationWindowSeconds: Time to wait before scaling action
# 5. scaleDown policies: Conservative to avoid flapping
# 6. scaleUp policies: Aggressive to handle traffic spikes
#
# Scaling Behavior:
# - Scale up quickly (30-60s) to handle traffic spikes
# - Scale down slowly (5-10min) to avoid flapping
# - Use multiple metrics for better scaling decisions
#
# Custom Metrics:
# - Requires Prometheus Adapter or similar metrics server
# - Metrics must be exposed by application
# - See custom-metrics.yaml for metric definitions
#
# Testing:
# kubectl get hpa --watch
# kubectl describe hpa auth-service-hpa
# kubectl top pods
#
# Deployment:
# kubectl apply -f hpa-policies.yaml
# kubectl get hpa
