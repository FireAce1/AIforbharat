apiVersion: v1
kind: Secret
metadata:
  name: krishiai-secrets
  namespace: default
type: Opaque
stringData:
  # Database Credentials
  DB_USER: "krishiai_user"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis Password
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # JWT Secret
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"
  
  # SMS Gateway (Twilio/MSG91)
  SMS_GATEWAY_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  SMS_GATEWAY_SENDER_ID: "KRISHIAI"
  
  # External API Keys
  IMD_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  ISRO_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  AGMARKNET_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  
  # Encryption Key (AES-256)
  ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION_32_BYTE_KEY"
  
  # Sentry DSN
  SENTRY_DSN: "CHANGE_ME_IN_PRODUCTION"
  
  # AWS/Cloud Credentials (if needed)
  AWS_ACCESS_KEY_ID: "CHANGE_ME_IN_PRODUCTION"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_IN_PRODUCTION"
  AWS_REGION: "ap-south-1"
