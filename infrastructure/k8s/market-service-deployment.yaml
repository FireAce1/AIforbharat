apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
  namespace: default
  labels:
    app: market-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: market-service
  template:
    metadata:
      labels:
        app: market-service
        tier: backend
    spec:
      containers:
      - name: market-service
        image: krishiai/market-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3001"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: krishiai-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: krishiai-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: krishiai-secrets
              key: REDIS_PASSWORD
        - name: AGMARKNET_API_KEY
          valueFrom:
            secretKeyRef:
              name: krishiai-secrets
              key: AGMARKNET_API_KEY
        - name: AGMARKNET_API_URL
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: AGMARKNET_API_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: NODE_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: krishiai-config
              key: LOG_LEVEL
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: krishiai-secrets
              key: SENTRY_DSN
        - name: SMS_GATEWAY_API_KEY
          valueFrom:
            secretKeyRef:
              name: krishiai-secrets
              key: SMS_GATEWAY_API_KEY
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: market-service
  namespace: default
  labels:
    app: market-service
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: market-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: market-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: market-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
