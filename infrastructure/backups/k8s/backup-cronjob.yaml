  name: weekly-backup
  namespace: default
  labels:
    app: database-backup
    backup-type: weekly
spec:
  schedule: "30 20 * * 0"  # Sunday 2:00 AM IST = Saturday 20:30 UTC
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: database-backup
        backup-type: weekly
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: database-backup
            backup-type: weekly
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:14-alpine
            command: ["/bin/sh"]
            args:
            - -c
            - |
              # Install AWS CLI
              apk add --no-cache aws-cli bash bc
              
              # Copy and execute backup script
              cp /scripts/weekly-backup.sh /tmp/weekly-backup.sh
              chmod +x /tmp/weekly-backup.sh
              /tmp/weekly-backup.sh
            env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: DB_PASSWORD
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: S3_BUCKET
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: TZ
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: backup-logs
              mountPath: /var/log/postgresql
            - name: metrics
              mountPath: /var/lib/postgresql/metrics
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 2Gi
          volumes:
          - name: scripts
            configMap:
              name: backup-scripts-files
              defaultMode: 0755
          - name: backup-logs
            emptyDir: {}
          - name: metrics
            emptyDir: {}

---
# Cleanup Old Backups CronJob
# Runs daily at 3:00 AM IST (21:30 UTC previous day)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-backups
  namespace: default
  labels:
    app: database-backup
    backup-type: cleanup
spec:
  schedule: "30 21 * * *"  # 3:00 AM IST = 21:30 UTC (previous day)
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: database-backup
        backup-type: cleanup
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 minute timeout
      template:
        metadata:
          labels:
            app: database-backup
            backup-type: cleanup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: amazon/aws-cli:latest
            command: ["/bin/sh"]
            args:
            - -c
            - |
              # Install bash and bc
              yum install -y bash bc
              
              # Copy and execute cleanup script
              cp /scripts/cleanup-old-backups.sh /tmp/cleanup-old-backups.sh
              chmod +x /tmp/cleanup-old-backups.sh
              /tmp/cleanup-old-backups.sh
            env:
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: S3_BUCKET
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: DAILY_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: DAILY_RETENTION_DAYS
            - name: WEEKLY_RETENTION_WEEKS
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: WEEKLY_RETENTION_WEEKS
            - name: WAL_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: WAL_RETENTION_DAYS
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: TZ
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: backup-logs
              mountPath: /var/log/postgresql
            - name: metrics
              mountPath: /var/lib/postgresql/metrics
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi
          volumes:
          - name: scripts
            configMap:
              name: backup-scripts-files
              defaultMode: 0755
          - name: backup-logs
            emptyDir: {}
          - name: metrics
            emptyDir: {}

