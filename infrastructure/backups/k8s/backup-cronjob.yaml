---
# Daily Snapshot CronJob
# Runs daily at 2:00 AM IST (20:30 UTC previous day)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-snapshot
  namespace: default
  labels:
    app: database-backup
    backup-type: daily
spec:
  schedule: "30 20 * * *"  # 2:00 AM IST = 20:30 UTC (previous day)
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid  # Don't run if previous job is still running
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: database-backup
        backup-type: daily
    spec:
      backoffLimit: 2  # Retry twice on failure
      activeDeadlineSeconds: 3600  # 1 hour timeout
      template:
        metadata:
          labels:
            app: database-backup
            backup-type: daily
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:14-alpine
            command: ["/bin/sh"]
            args:
            - -c
            - |
              # Install AWS CLI
              apk add --no-cache aws-cli bash bc
              
              # Copy and execute backup script
              cp /scripts/daily-snapshot.sh /tmp/daily-snapshot.sh
              chmod +x /tmp/daily-snapshot.sh
              /tmp/daily-snapshot.sh
            env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: DB_PASSWORD
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: S3_BUCKET
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: backup-config
                  key: TZ
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: backup-logs
              mountPath: /var/log/postgresql
            - name: metrics
              mountPath: /var/lib/postgresql/metrics
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
          volumes:
          - name: scripts
            configMap:
              name: backup-scripts-files
              defaultMode: 0755
          - name: backup-logs
            emptyDir: {}
          - name: metrics
            emptyDir: {}

---
# Weekly Full Backup CronJob
# Runs weekly on Sundays at 2:00 AM IST (20:30 UTC Saturday)
apiVersion: batch/v1
kind: CronJob
