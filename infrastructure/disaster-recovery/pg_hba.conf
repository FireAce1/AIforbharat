# PostgreSQL Client Authentication Configuration
# KrishiAI Platform - Disaster Recovery

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ============================================================================
# LOCAL CONNECTIONS
# ============================================================================

# "local" is for Unix domain socket connections only
local   all             all                                     scram-sha-256

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# ============================================================================
# REPLICATION CONNECTIONS
# ============================================================================

# Allow replication connections from replica in us-west-2
# Replace with actual replica IP addresses or CIDR ranges
host    replication     replicator      10.0.0.0/8              scram-sha-256
host    replication     replicator      172.16.0.0/12           scram-sha-256
host    replication     replicator      192.168.0.0/16          scram-sha-256

# SSL-only replication connections (recommended for production)
hostssl replication     replicator      0.0.0.0/0               scram-sha-256

# ============================================================================
# APPLICATION CONNECTIONS
# ============================================================================

# Allow connections from Kubernetes pods (adjust CIDR as needed)
host    krishiai_db     postgres        10.0.0.0/8              scram-sha-256
host    krishiai_db     postgres        172.16.0.0/12           scram-sha-256

# SSL-only connections for production
hostssl krishiai_db     postgres        0.0.0.0/0               scram-sha-256

# ============================================================================
# MONITORING CONNECTIONS
# ============================================================================

# Allow monitoring tools (Prometheus, health checks)
host    all             monitoring      10.0.0.0/8              scram-sha-256
host    all             monitoring      172.16.0.0/12           scram-sha-256

# ============================================================================
# NOTES
# ============================================================================

# Authentication Methods:
# - scram-sha-256: Most secure password authentication
# - md5: Legacy, less secure (avoid in production)
# - trust: No password required (only for local development)
# - cert: Certificate-based authentication
#
# Connection Types:
# - local: Unix domain socket
# - host: TCP/IP (plain or SSL)
# - hostssl: TCP/IP with SSL required
# - hostnossl: TCP/IP without SSL
#
# Security Best Practices:
# 1. Use hostssl for all external connections
# 2. Use scram-sha-256 for password authentication
# 3. Restrict IP ranges to known networks
# 4. Use certificate authentication for replication
# 5. Regularly rotate passwords
#
# After modifying this file:
# 1. Validate: pg_ctl reload
# 2. Test connections from replica
# 3. Monitor authentication logs
