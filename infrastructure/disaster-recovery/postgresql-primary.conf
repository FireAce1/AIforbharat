# PostgreSQL Primary Configuration for Disaster Recovery
# KrishiAI Platform - Primary Region (us-east-1)

# ============================================================================
# REPLICATION SETTINGS
# ============================================================================

# Enable WAL archiving and streaming replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# Synchronous replication (optional - use for critical data)
# synchronous_standby_names = 'replica1'  # Uncomment for synchronous mode
# synchronous_commit = on

# WAL archiving to S3 (for backup and PITR)
archive_mode = on
archive_command = '/usr/local/bin/archive-wal.sh %p %f'
archive_timeout = 60

# ============================================================================
# WRITE AHEAD LOG
# ============================================================================

# WAL configuration for replication
wal_compression = on
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 1GB

# ============================================================================
# REPLICATION SLOTS
# ============================================================================

# Hot standby feedback (prevents query conflicts on replica)
hot_standby_feedback = on

# ============================================================================
# QUERY TUNING
# ============================================================================

# Memory settings
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 32MB

# Planner settings
random_page_cost = 1.1
effective_io_concurrency = 200

# ============================================================================
# MONITORING
# ============================================================================

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 0
log_autovacuum_min_duration = 0

# Replication monitoring
log_replication_commands = on

# ============================================================================
# STATISTICS
# ============================================================================

# Track activity
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Statistics collection
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# ============================================================================
# AUTOVACUUM
# ============================================================================

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# Connection pooling
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ============================================================================
# SECURITY
# ============================================================================

# SSL configuration
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_ca_file = '/etc/ssl/certs/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'
ssl_ciphers = 'HIGH:!aNULL:!MD5'

# Password encryption
password_encryption = scram-sha-256

# ============================================================================
# LOCALE AND FORMATTING
# ============================================================================

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ============================================================================
# DISASTER RECOVERY SPECIFIC
# ============================================================================

# Promote trigger file (for manual promotion)
# promote_trigger_file = '/tmp/postgresql.trigger.5432'

# Recovery settings (not used on primary, but documented for reference)
# restore_command = 'aws s3 cp s3://krishiai-db-backups/wal-archive/%f %p'
# recovery_target_timeline = 'latest'

# ============================================================================
# PERFORMANCE MONITORING
# ============================================================================

# Statement timeout (prevent long-running queries)
statement_timeout = 300000  # 5 minutes

# Lock timeout
lock_timeout = 30000  # 30 seconds

# Idle in transaction timeout
idle_in_transaction_session_timeout = 600000  # 10 minutes

# ============================================================================
# NOTES
# ============================================================================

# This configuration is optimized for:
# - Streaming replication to secondary region
# - High availability and disaster recovery
# - Production workload with moderate write load
# - 8GB RAM, 4 CPU cores (adjust based on actual resources)
#
# After modifying this file:
# 1. Validate: pg_ctl reload
# 2. Restart if needed: pg_ctl restart
# 3. Verify replication: SELECT * FROM pg_stat_replication;
