# PostgreSQL Replica Configuration for Disaster Recovery
# KrishiAI Platform - Secondary Region (us-west-2)

# ============================================================================
# REPLICATION SETTINGS
# ============================================================================

# Enable hot standby (read-only queries on replica)
hot_standby = on
hot_standby_feedback = on

# WAL receiver settings
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s
wal_receiver_status_interval = 10s
wal_receiver_timeout = 60s
wal_retrieve_retry_interval = 5s

# ============================================================================
# RECOVERY SETTINGS
# ============================================================================

# Primary connection info (set via environment variables in Kubernetes)
# primary_conninfo = 'host=primary-db.us-east-1.rds.amazonaws.com port=5432 user=replicator password=xxx sslmode=require'
# primary_slot_name = 'replica_slot_1'

# Recovery target (for PITR if needed)
recovery_target_timeline = 'latest'

# Restore command for WAL files from S3 (fallback if streaming fails)
restore_command = 'aws s3 cp s3://krishiai-db-backups-us-west-2/wal-archive/%f %p'

# Promote trigger file (for automated failover)
promote_trigger_file = '/tmp/postgresql.trigger.5432'

# ============================================================================
# WRITE AHEAD LOG
# ============================================================================

# WAL configuration (same as primary for consistency)
wal_level = replica
wal_compression = on
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 1GB

# Prepare for potential promotion to primary
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# ============================================================================
# QUERY TUNING
# ============================================================================

# Memory settings (same as primary)
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 32MB

# Planner settings
random_page_cost = 1.1
effective_io_concurrency = 200

# ============================================================================
# MONITORING
# ============================================================================

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 0

# Replication monitoring
log_replication_commands = on

# Recovery monitoring
log_min_messages = info
log_recovery_conflict_waits = on

# ============================================================================
# STATISTICS
# ============================================================================

# Track activity
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Statistics collection
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# ============================================================================
# AUTOVACUUM
# ============================================================================

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# Connection pooling
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ============================================================================
# SECURITY
# ============================================================================

# SSL configuration
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_ca_file = '/etc/ssl/certs/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'
ssl_ciphers = 'HIGH:!aNULL:!MD5'

# Password encryption
password_encryption = scram-sha-256

# ============================================================================
# LOCALE AND FORMATTING
# ============================================================================

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ============================================================================
# REPLICA-SPECIFIC SETTINGS
# ============================================================================

# Allow read-only queries on replica
default_transaction_read_only = on

# Conflict resolution (favor replica queries over replication)
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s

# ============================================================================
# PERFORMANCE MONITORING
# ============================================================================

# Statement timeout (prevent long-running queries)
statement_timeout = 300000  # 5 minutes

# Lock timeout
lock_timeout = 30000  # 30 seconds

# Idle in transaction timeout
idle_in_transaction_session_timeout = 600000  # 10 minutes

# ============================================================================
# FAILOVER PREPARATION
# ============================================================================

# Archive mode (ready for promotion)
archive_mode = on
archive_command = '/usr/local/bin/archive-wal.sh %p %f'
archive_timeout = 60

# ============================================================================
# NOTES
# ============================================================================

# This configuration is optimized for:
# - Hot standby replica receiving streaming replication
# - Read-only query support on replica
# - Fast promotion to primary during failover
# - Production workload with moderate read load
# - 8GB RAM, 4 CPU cores (adjust based on actual resources)
#
# Replication Setup:
# 1. Take base backup from primary: pg_basebackup
# 2. Create standby.signal file in data directory
# 3. Set primary_conninfo in postgresql.auto.conf or environment
# 4. Start PostgreSQL
#
# Promotion to Primary:
# 1. Automated: Touch promote_trigger_file
# 2. Manual: pg_ctl promote
# 3. Verify: SELECT pg_is_in_recovery(); (should return false)
#
# After promotion:
# 1. Remove standby.signal file
# 2. Update application connection strings
# 3. Configure new replica if needed
