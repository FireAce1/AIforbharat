# SSL/TLS Parameters for KrishiAI Platform
# TLS 1.3 only with strong cipher suites

# SSL Protocols - TLS 1.3 only for maximum security
ssl_protocols TLSv1.3;

# Prefer server ciphers
ssl_prefer_server_ciphers off;

# TLS 1.3 Cipher Suites (automatically selected by TLS 1.3)
# TLS 1.3 uses a simplified cipher suite selection
# The following are the default TLS 1.3 cipher suites:
# - TLS_AES_128_GCM_SHA256
# - TLS_AES_256_GCM_SHA384
# - TLS_CHACHA20_POLY1305_SHA256

# Diffie-Hellman parameters for DHE cipher suites
ssl_dhparam /etc/nginx/dhparam.pem;

# SSL Session Configuration
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/nginx/certs/chain.pem;

# DNS resolver for OCSP
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Buffer sizes
ssl_buffer_size 8k;

# Early Data (0-RTT) - Disabled for security
ssl_early_data off;
