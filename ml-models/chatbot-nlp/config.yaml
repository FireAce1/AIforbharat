# Chatbot NLP Model Configuration

model:
  name: "ai4bharat/indic-bert"
  num_labels: 20
  max_length: 128
  
training:
  epochs: 10
  batch_size: 16
  learning_rate: 2e-5
  warmup_steps: 500
  weight_decay: 0.01
  validation_split: 0.2
  early_stopping_patience: 3
  
data:
  training_file: "data/training_data.json"
  validation_file: "data/validation_data.json"
  response_templates_file: "data/response_templates.json"
  
output:
  model_dir: "models/intent_classifier"
  tokenizer_dir: "models/tokenizer"
  logs_dir: "logs"
  
inference:
  confidence_threshold: 0.85
  max_alternatives: 3
  
intents:
  - weather_query
  - price_query
  - disease_identification
  - crop_recommendation
  - irrigation_advice
  - scheme_information
  - pest_control
  - fertilizer_advice
  - market_information
  - sowing_time
  - harvest_time
  - soil_health
  - organic_farming
  - loan_information
  - insurance_query
  - subsidy_query
  - general_farming
  - equipment_advice
  - storage_advice
  - transport_help

languages:
  - hi  # Hindi
  - mr  # Marathi
